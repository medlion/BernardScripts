events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    client_max_body_size <MAX_UPLOAD_SIZE>M;

    keepalive_timeout  65;

    # Determine HTTPS for upstream apps behind a reverse proxy / load balancer
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https   on;
        http    off;
    }

    upstream php_fpm_upstream {
        server localhost:9000;
        keepalive 32;
    }


    server {
        listen 80;
        server_name localhost;

        root /var/www/public;
        index index.php index.html;

         # Security and CSP headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Placeholder policy: extend it with the external hosts (CDNs, fonts, storage, payment) the project needs
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;" always;

        # Dev only (live): Vite runs in the node container, which shares this network namespace
        location ~ ^/(@vite|@fs|@id|@react-refresh|resources|node_modules|__laravel_vite_plugin__)(/|$) {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Vite HMR websocket (connects to the site root with the vite-hmr subprotocol, any path is accepted by Vite)
        location = /__vite_hmr {
            proxy_pass http://127.0.0.1:5173/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            if ($http_sec_websocket_protocol = "vite-hmr") {
                rewrite ^ /__vite_hmr last;
            }
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass localhost:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Forward proxy headers so Laravel generates https URLs when behind a proxy
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_param X-Forwarded-Proto $http_x_forwarded_proto;
            fastcgi_param X-Forwarded-Host $host;
            fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
            include fastcgi_params;
        }
    }
}
